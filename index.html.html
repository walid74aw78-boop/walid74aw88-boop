<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            color: #fff;
        }

        /* ===== شاشة تسجيل الدخول ===== */
        #loginScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #0d0d0d 0%, #000 100%);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9999;
            transition: all 0.5s;
        }
        #loginScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .login-box {
            background: #1a1a1a;
            padding: 50px 40px;
            border-radius: 20px;
            border: 1px solid #2a2a2a;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 0 60px rgba(0, 255, 170, 0.05);
        }
        .login-box .logo {
            font-size: 50px;
            color: #00ffaa;
            margin-bottom: 10px;
        }
        .login-box h1 {
            font-size: 24px;
            color: #fff;
            margin-bottom: 5px;
        }
        .login-box .sub {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .login-box input {
            width: 100%;
            padding: 14px 18px;
            margin: 10px 0;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            background: #111;
            color: #fff;
            font-size: 16px;
            transition: 0.3s;
        }
        .login-box input:focus {
            border-color: #00ffaa;
            outline: none;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.1);
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00ffaa, #00cc88);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        .login-box button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(0, 255, 170, 0.2);
        }
        .login-box .error {
            color: #ff3355;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* ===== الواجهة الرئيسية ===== */
        #mainScreen {
            display: none;
            min-height: 100vh;
            padding: 20px;
        }
        #mainScreen.active {
            display: block;
        }

        /* الهيدر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #111;
            border-radius: 15px;
            border: 1px solid #1a1a1a;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header .brand i {
            color: #00ffaa;
            font-size: 28px;
        }
        .header .brand span {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }
        .header .brand small {
            color: #666;
            font-size: 12px;
        }
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .header .user-info .badge {
            background: #00ffaa22;
            color: #00ffaa;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #00ffaa33;
        }
        .header .user-info button {
            background: #ff335533;
            color: #ff3355;
            border: 1px solid #ff335544;
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .header .user-info button:hover {
            background: #ff3355;
            color: #fff;
        }

        /* الشبكة (Grid) */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* البطاقات */
        .card {
            background: #111;
            border-radius: 15px;
            border: 1px solid #1a1a1a;
            padding: 22px;
            transition: 0.3s;
        }
        .card:hover {
            border-color: #00ffaa44;
            transform: translateY(-2px);
        }
        .card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .card .card-header h3 {
            font-size: 16px;
            color: #aaa;
            font-weight: 400;
        }
        .card .card-header i {
            font-size: 22px;
            color: #00ffaa;
        }
        .card .code-area {
            background: #0a0a0a;
            border-radius: 10px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #88ffbb;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid #1a1a1a;
            margin-bottom: 12px;
            direction: ltr;
            text-align: left;
        }
        .card .code-area::-webkit-scrollbar {
            width: 4px;
        }
        .card .code-area::-webkit-scrollbar-thumb {
            background: #00ffaa33;
            border-radius: 10px;
        }
        .card .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .card .actions button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
            background: #1a1a1a;
            color: #aaa;
        }
        .card .actions button:hover {
            background: #00ffaa22;
            color: #00ffaa;
        }
        .card .actions .copy-btn {
            background: #00ffaa22;
            color: #00ffaa;
        }
        .card .actions .copy-btn:hover {
            background: #00ffaa;
            color: #000;
        }
        .card .actions .download-btn {
            background: #3355ff22;
            color: #5588ff;
        }
        .card .actions .download-btn:hover {
            background: #3355ff;
            color: #fff;
        }

        /* قسم الذكاء الاصطناعي */
        .ai-section {
            background: #111;
            border-radius: 15px;
            border: 1px solid #1a1a1a;
            padding: 25px;
            margin-top: 10px;
        }
        .ai-section .ai-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        .ai-section .ai-header i {
            color: #00ffaa;
            font-size: 28px;
            animation: pulse 2s infinite;
        }

            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .ai-section .ai-header h2 {
            font-size: 20px;
            color: #fff;
        }
        .ai-section .ai-header small {
            color: #666;
            font-size: 13px;
        }
        .ai-input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .ai-input-group input {
            flex: 1;
            min-width: 200px;
            padding: 14px 18px;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            background: #0a0a0a;
            color: #fff;
            font-size: 15px;
        }
        .ai-input-group input:focus {
            border-color: #00ffaa;
            outline: none;
        }
        .ai-input-group button {
            padding: 14px 30px;
            background: linear-gradient(135deg, #00ffaa, #00cc88);
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .ai-input-group button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.2);
        }
        .ai-response {
            margin-top: 18px;
            background: #0a0a0a;
            border-radius: 10px;
            padding: 18px;
            border: 1px solid #1a1a1a;
            min-height: 80px;
            color: #88ffbb;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
            direction: ltr;
            text-align: left;
        }
        .ai-response.active {
            display: block;
        }

        /* قسم الروابط المسجلة */
        .logs-section {
            margin-top: 25px;
        }
        .logs-section .log-item {
            background: #0a0a0a;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 8px;
            border-left: 3px solid #00ffaa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logs-section .log-item .log-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .logs-section .log-item .log-info .time {
            color: #666;
            font-size: 12px;
        }
        .logs-section .log-item .log-info .data {
            color: #88ffbb;
            font-size: 13px;
            word-break: break-all;
        }
        .logs-section .log-item .log-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            background: #00ffaa22;
            color: #00ffaa;
        }

            color: #444;
            text-align: center;
            padding: 30px;

                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .header .brand {
                justify-content: center;
            }
            .header .user-info {
                justify-content: center;
            }
            .grid {
                grid-template-columns: 1fr;
            }
            .login-box {
                padding: 30px 20px;
                margin: 15px;
            }
            .ai-input-group input {
                min-width: 100%;
            }
            .ai-input-group button {
                width: 100%;
            }
            .card .code-area {
                font-size: 11px;
                max-height: 150px;
            }
            .logs-section .log-item {
                flex-direction: column;
                align-items: flex-start;
            }

            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            background: #00ffaa22;
            color: #00ffaa;

            background: #ff335522;
            color: #ff3355;
        }
        .glow-text {
            color: #00ffaa;
            text-shadow: 0 0 20px rgba(0, 255, 170, 0.15);
        }
    </style>
</head>

        // =============================================================

        function handleLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const error = document.getElementById('loginError');

            if (user === VALID_USER && pass === VALID_PASS) {
                error.style.display = 'none';
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainScreen').classList.add('active');
                renderCodes();
                loadLogs();
            } else {
                error.style.display = 'block';
                setTimeout(() => { error.style.display = 'none'; }, 3000);
            }
        }

        document.addEventListener('keydown', (e) => {

        // =============================================================

        function renderCodes() {
            const grid = document.getElementById('codeGrid');
            grid.innerHTML = '';
            CODES.forEach(code => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <h3><i class="fab ${code.icon}"></i> ${code.name}</h3>
                        <i class="fas fa-code"></i>
                    </div>
                    <div class="code-area" id="code_${code.id}">${escapeHtml(code.code)}</div>
                    <div class="actions">
                        <button class="copy-btn" onclick="copyCode('${code.id}')"><i class="fas fa-copy"></i> نسخ</button>
                        <button class="download-btn" onclick="downloadCode('${code.id}')"><i class="fas fa-download"></i> تحميل</button>
                        <button onclick="testCode('${code.id}')"><i class="fas fa-play"></i> اختبار</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // =============================================================
        //  أكواد مساعدة
        // =============================================================
        function copyCode(id) {
            const area = document.getElementById(`code_${id}`);
            const text = area.textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector(`#code_${id}`).parentElement.querySelector('.copy-btn');
                const orig = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> تم';
                setTimeout(() => btn.innerHTML = orig, 1500);
            });
        }

        function downloadCode(id) {
            const area = document.getElementById(`code_${id}`);

        // =============================================================
        //  سجل العمليات والبيانات
        // =============================================================
        function addLog(type, message, status = 'جديد') {
            const logs = JSON.parse(localStorage.getItem('hack_logs') || '[]');
            logs.unshift({
                id: Date.now(),
                type: type,
                message: message,
                status: status,
                time: new Date().toLocaleString('ar-SA')
            });
            if (logs.length > 100) logs.pop();
            localStorage.setItem('hack_logs', JSON.stringify(logs));
            renderLogs();
        }

        function loadLogs() {
            renderLogs();
        }

        function renderLogs() {
            const container = document.getElementById('logsContainer');
            const logs = JSON.parse(localStorage.getItem('hack_logs') || '[]');

            if (logs.length === 0) {
                container.innerHTML = `<div class="empty-logs">📭 لا توجد بيانات مسجلة بعد</div>`;
                return;
            }

            container.innerHTML = '';
            logs.forEach(log => {
                const div = document.createElement('div');
                div.className = 'log-item';
                const statusClass = log.status === 'ناجح' ? '' : 'offline';
                div.innerHTML = `
                    <div class="log-info">
                        <span class="time">${log.time}</span>
                        <span class="data">${log.message}</span>
                    </div>
                    <span class="log-status ${statusClass}">${log.status}</span>
                `;
                container.appendChild(div);
            });
        }

        function clearLogs() {
            if (confirm('هل أنت متأكد من مسح جميع السجلات؟')) {
                localStorage.removeItem('hack_logs');
                renderLogs();
            }
